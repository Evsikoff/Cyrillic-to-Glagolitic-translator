<!doctype html>
<html lang="ru" data-appearance="light" data-platform="web">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Переводчик с кириллицы на глаголицу и обратно"
    />
    <meta id="theme-color" name="theme-color" content="#f2f3f5" />
    <title>Кириллица ↔ Глаголица</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="translator-app" aria-labelledby="app-title">
        <header class="app-header">
          <div class="heading-copy">
            <h1 id="app-title">Кириллица ↔ Глаголица</h1>
            <p class="description">
              Перевод выполняется сразу при вводе. При обратном переводе
              неоднозначные буквы восстанавливаются как Е и И.
            </p>
          </div>

          <button
            id="swap-direction"
            class="direction-button"
            type="button"
            aria-label="Переключить направление перевода"
          >
            <span class="direction-icon" aria-hidden="true">⇄</span>
            <span>Сменить направление</span>
          </button>
        </header>

        <div class="translation-grid">
          <section class="input-group" aria-labelledby="input-label">
            <div class="field-heading">
              <label id="input-label" for="input">Русский (Кириллица)</label>
            </div>
            <textarea
              id="input"
              placeholder="Введите текст здесь…"
              autocomplete="off"
              autocapitalize="sentences"
              spellcheck="true"
            ></textarea>
          </section>

          <section class="input-group" aria-labelledby="output-label">
            <div class="field-heading">
              <label id="output-label" for="output">Глаголица</label>
              <button id="copy-output" class="copy-button" type="button" disabled>
                Копировать
              </button>
            </div>
            <textarea
              id="output"
              readonly
              placeholder="Ⱃⰵⰸⱆⰾⱐⱅⰰⱅ…"
              aria-live="polite"
            ></textarea>
          </section>
        </div>

        <p class="privacy-note">
          Введённый текст обрабатывается только на вашем устройстве и никуда не
          отправляется.
        </p>
      </main>

      <aside class="banner" aria-label="Рекламное объявление">
        <a
          class="banner-link"
          href="https://vk.ru/market/product/nastolnaya-igra-quotadmiral-taktika-risk-i-sudbaquot-kompaktnaya-versia-227786453-8922274"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Реклама. Открыть страницу настольной игры «Адмирал» во ВКонтакте"
        >
          <span class="ad-label">Реклама</span>
          <img
            class="banner-image"
            src="/banner.jpg"
            alt="Настольная игра «Адмирал: тактика, риск и судьба»"
            width="1536"
            height="1024"
            loading="lazy"
            decoding="async"
          />
        </a>
      </aside>
    </div>

    <div id="copy-status" class="sr-only" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript-message">Для работы переводчика включите JavaScript.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
